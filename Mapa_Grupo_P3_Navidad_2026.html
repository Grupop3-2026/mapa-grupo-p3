<style>
*{box-sizing:border-box} body{margin:0;background:#eef1f2;font-family:Arial,Helvetica,sans-serif;color:#202a30}
.app{width:min(1120px,97vw);margin:14px auto;background:#fff;border:1px solid #d4d9dc;border-radius:14px;overflow:hidden;box-shadow:0 8px 28px #0002}
header{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;border-bottom:1px solid #ddd}
h1{font-size:20px;margin:0} .sub{font-size:11px;color:#66737a;margin-top:3px}
.controls{display:flex;gap:5px}button{border:1px solid #cbd3d7;background:white;border-radius:7px;padding:7px 10px;font-weight:bold;cursor:pointer}
.map{position:relative;height:min(72vw,660px);min-height:500px;overflow:hidden;background:#fff;touch-action:none;cursor:grab}

.scene{position:absolute;left:50%;top:50%;width:762px;height:660px;transform-origin:center center}

.markers{position:absolute;left:0;top:0;width:762px;height:660px}
.marker{position:absolute;transform:translate(-50%,-50%);z-index:5;cursor:pointer}
.dot{width:14px;height:14px;border-radius:50%;background:#d71920;border:3px solid white;box-shadow:0 1px 5px #0008}
.marker.sel .dot{background:#ffb000;box-shadow:0 0 0 3px white,0 0 0 6px #d71920}
.label{display:none;position:absolute;left:11px;top:-7px;white-space:nowrap;background:#fff;border:1px solid #bfc9ce;border-radius:6px;padding:3px 6px;font-size:10px;box-shadow:0 2px 7px #0004}
.marker.sel .label{display:block}
.panel{position:absolute;right:12px;bottom:12px;z-index:20;width:min(330px,45vw);max-height:220px;overflow:auto;background:#fffffff5;border:1px solid #cbd4d8;border-radius:12px;box-shadow:0 5px 18px #0004;padding:11px;display:none}
.panel.show{display:block} .panel h2{font-size:16px;margin:0 0 6px} .nums span{display:inline-block;background:#eef2f4;border-radius:5px;padding:3px 6px;margin:2px;font-size:12px}
.info{position:absolute;left:10px;bottom:10px;z-index:10;background:#ffffffe8;border-radius:7px;padding:5px 7px;font-size:10px;color:#58666d}
footer{font-size:10px;color:#69757a;padding:7px 12px;border-top:1px solid #ddd}
@media(max-width:700px){header h1{font-size:16px} .map{min-height:430px}}
</style></head>

const scene=document.getElementById('scene'), markers=document.getElementById('markers'), map=document.getElementById('map'), panel=document.getElementById('panel');
let scale=1, ox=0, oy=0, dragging=false, sx=0, sy=0, sox=0, soy=0;
function project(t){
  if(t.name==='La Guancha') return [553,578];
  const x=48+(t.lon+9.3)/(3.35+9.3)*(681-48);
  const y=575-(t.lat-36.0)/(43.9-36.0)*(575-18);
  return [x,y];
}
function render(){
  scene.style.transform=`translate(calc(-50% + ${ox}px),calc(-50% + ${oy}px)) scale(${scale})`;
  markers.innerHTML='';
  towns.forEach((t,i)=>{
    const [x,y]=project(t), m=document.createElement('div'); m.className='marker'; m.style.left=x+'px'; m.style.top=y+'px';
    m.innerHTML=`<div class="dot"></div><div class="label">${t.name} · ${t.nums.length} décimo${t.nums.length===1?'':'s'}</div>`;
    m.onclick=e=>{e.stopPropagation();document.querySelectorAll('.marker.sel').forEach(a=>a.classList.remove('sel'));m.classList.add('sel');panel.innerHTML='<h2>📍 '+t.name+'</h2><div class="nums">'+t.nums.map(n=>'<span>'+n+'</span>').join('')+'</div>';panel.classList.add('show');};
    markers.appendChild(m);
  });
}
function zoom(f){
  const ns=Math.max(.75,Math.min(3.8,scale*f)); scale=ns; render();
}
document.getElementById('in').onclick=()=>zoom(1.25); document.getElementById('out').onclick=()=>zoom(.8);
document.getElementById('home').onclick=()=>{scale=1;ox=0;oy=0;panel.classList.remove('show');render()};
map.addEventListener('pointerdown',e=>{if(e.target.closest('.marker')||e.target.closest('.panel'))return;dragging=true;sx=e.clientX;sy=e.clientY;sox=ox;soy=oy;map.classList.add('drag');map.setPointerCapture(e.pointerId)});
map.addEventListener('pointermove',e=>{if(!dragging)return;ox=sox+(e.clientX-sx);oy=soy+(e.clientY-sy);render()});
map.addEventListener('pointerup',()=>{dragging=false;map.classList.remove('drag')});
map.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:.87)},{passive:false});
map.addEventListener('click',e=>{if(!e.target.closest('.marker'))panel.classList.remove('show')});
render();
